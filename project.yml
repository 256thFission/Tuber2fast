name: TuberNotes

options:
  bundleIdPrefix: com.tubernotes.greenfield
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Per-developer signing lives in Local.xcconfig, which is gitignored and
# written by Tools/setup. A team ID committed here would make every
# peer's checkout dirty the moment they built.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: $(TN_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    # Every target is one package, so `package` is the honest default for a
    # declaration one module up the graph needs and nobody outside the app
    # should ever see. `public` here would mean "part of a shipped framework's
    # API", and nothing in this repository ships a framework.
    SWIFT_PACKAGE_NAME: TuberNotes
  configs:
    # DEBUG in Debug and nothing in Release, which is all this has ever
    # needed to be. There was a `$(TN_SPIKE_CONDITIONS)` interpolation here,
    # so that a device spike could be compiled in from the command line; the
    # two spikes it gated are deleted, and a build setting that gates nothing
    # is a setting the next reader has to rule out.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

# The module graph, bottom first. It exists to make golden rule 2's *import*
# half a compile error rather than a token scan: see `noSwiftUI` below and
# `Docs/Forks/ContractPass/08-Modules.md`.
#
#   TuberCore   <- TuberModel <- TuberStore <- TuberRender <- TuberCanvas
#        \____________\______________\______________\____________\__ TuberNotes
#
# TuberCanvas deliberately does *not* depend on TuberStore. The canvas runtime
# never sees the store — it holds a `StaticLayerRenderer`, and the renderer
# holds the store. Keep it that way: a canvas that can name `DocumentStoring`
# is one refactor away from breaking golden rule 4.
targetTemplates:
  # Every framework target below the app. Same product shape, same warnings.
  Framework:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).${target_name}
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        # A framework nobody outside this repository links needs no stable
        # ABI and no generated .swiftinterface.
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        DEFINES_MODULE: YES
        # No SwiftUI below the app target — the compiler's answer to golden
        # rule 2's import half.
        #
        # It is spelled as a module alias, not as an absent link, because an
        # absent link does not forbid anything: Swift autolinks an imported
        # system framework and the linker finds it in the SDK, so a framework
        # target that never lists SwiftUI still builds if a file imports it.
        # `-module-alias SwiftUI=<nothing>` makes `import SwiftUI` resolve to
        # a module that does not exist. Observed, on a planted violation in
        # `InkCanvasView.swift`:
        #
        #   Modules/TuberCanvas/InkCanvasView.swift:1:8: error: unable to
        #   resolve module dependency: 'TuberSwiftUIIsNotBelowTheAppTarget'
        #
        # — which is why the alias is named a sentence rather than a letter:
        # the alias name is the whole of the error message a contributor sees.
        #
        # Only SwiftUI is banned this way. UIKit, PencilKit, and CoreGraphics
        # cannot be: PencilKit requires UIKit and Foundation requires
        # CoreGraphics, and an alias breaks the *transitive* load as well as
        # the written import ("missing required module 'UIKit'"). Which
        # targets may import those three stays a `ContractStructureTests`
        # rule, now written per module instead of per file.
        OTHER_SWIFT_FLAGS: $(inherited) -module-alias SwiftUI=TuberSwiftUIIsNotBelowTheAppTarget

targets:

  # The floor: structured logging and the crash handler. Foundation + os.
  # It is imported by the store, the renderer, the snapshot, and the canvas
  # runtime, so it cannot live anywhere but the bottom.
  TuberCore:
    templates: [Framework]
    sources:
      - path: Modules/TuberCore

  # The durable value types, and the box that carries a drawing out of the
  # canvas runtime.
  #
  # **TuberModel links PencilKit, by Phillip's decision (2026-08-07).** The
  # dropped claim, stated so nobody re-derives it: *this project no longer
  # claims that no durable value type ever imports PencilKit.* `DrawingSnapshot`
  # is the `PKDrawing` box and it crosses every seam the graph draws; the
  # alternative was a sixth target holding one 56-line file. TuberNotes is an
  # iPad-and-Pencil application forever, so PencilKit at the model layer costs
  # nothing this project would otherwise have kept. There is no TuberInk.
  #
  # UIKit and SwiftUI remain out: UIKit arrives transitively with PencilKit and
  # so cannot be banned by the compiler, but no file here writes the import and
  # `ContractStructureTests` says so.
  TuberModel:
    templates: [Framework]
    sources:
      - path: Modules/TuberModel
    dependencies:
      - target: TuberCore

  # `DocumentStore`, the `DocumentStoring` seam its consumers declare, and the
  # durable file form. The only target that touches the file system.
  TuberStore:
    templates: [Framework]
    sources:
      - path: Modules/TuberStore
    dependencies:
      - target: TuberModel
      - target: TuberCore

  # Off-main decode and composite: `StaticLayerRenderer`, `PDFSource`, the
  # lens. Depends on TuberStore because the renderer holds the store — through
  # `DocumentStoring`, so the edge is to a surface rather than to an actor.
  #
  # PDFKit is deliberately not linked and never should be: `PDFSource.swift`
  # records the decision to open a source PDF with `CGPDFDocument` instead,
  # because PDFKit brings a whole document *view* stack for a page count and a
  # page box.
  TuberRender:
    templates: [Framework]
    sources:
      - path: Modules/TuberRender
    dependencies:
      - target: TuberStore
      - target: TuberModel
      - target: TuberCore

  # The canvas runtime: everything that owns frame-frequency state.
  #
  # No TuberStore edge, on purpose — see the graph comment above.
  TuberCanvas:
    templates: [Framework]
    sources:
      - path: Modules/TuberCanvas
    dependencies:
      - target: TuberRender
      - target: TuberModel
      - target: TuberCore

  # ---- v2 modules (D14: coexist beside Tuber*, swap in 6a, delete Tuber* in 6c) ----

  # Logging and the one trap. Foundation + os.
  TNCore:
    templates: [Framework]
    sources:
      - path: Modules/TNCore

  # Durable values and identities. PencilKit and CoreGraphics for value types
  # only (PKDrawing, CGImage cross the seams as immutable values). No UIKit,
  # no I/O.
  TNModel:
    templates: [Framework]
    sources:
      - path: Modules/TNModel
    dependencies:
      - target: TNCore

  # The package format: layout, codecs, the ink container, the planner, the
  # store actor, and the file-primitive seam. The only v2 module that names a
  # file API.
  TNFormat:
    templates: [Framework]
    sources:
      - path: Modules/TNFormat
    dependencies:
      - target: TNModel
      - target: TNCore

  # The notebook: custody, page states, the save engine, history. PencilKit
  # for the PKDrawing value only; no UIKit written, no I/O (the store seam).
  TNNotebook:
    templates: [Framework]
    sources:
      - path: Modules/TNNotebook
    dependencies:
      - target: TNFormat
      - target: TNModel
      - target: TNCore

  # The library: the tree, the trash, the checkout ledger, the identity
  # index. LibraryStore is the one file that names a file API.
  TNLibrary:
    templates: [Framework]
    sources:
      - path: Modules/TNLibrary
    dependencies:
      - target: TNNotebook
      - target: TNFormat
      - target: TNModel
      - target: TNCore

  TuberNotes:
    type: application
    platform: iOS
    sources:
      - path: TuberNotesApp
    dependencies:
      - target: TuberCanvas
      - target: TuberRender
      - target: TuberStore
      - target: TuberModel
      - target: TuberCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX)
        PRODUCT_NAME: TuberNotes
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The spike has one fixed document and no same-document coordinator.
        # Multiple scenes are enabled only after the despiking architecture
        # supplies scene-scoped sessions and serialized document commits.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        # All four orientations: the library browser letterboxed on a landscape
        # iPad, and Phillip lifted the portrait pin on 2026-08-08. The coupled
        # bound moved with it — PageProjection.widestSupportedViewportPoints is
        # 1376 (the 13-inch iPad Pro's long edge), and PageGeometryTests holds
        # the pairing: re-pinning portrait without lowering the bound leaves it
        # safely conservative, but widening support without raising it is the
        # trap the test names.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

  TuberNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuberNotesTests
    dependencies:
      - target: TuberNotes
      # Linked but not embedded: the host app already carries them, and a
      # second copy inside the test bundle is a second copy of every global.
      - target: TuberCanvas
        embed: false
      - target: TuberRender
        embed: false
      - target: TuberStore
        embed: false
      - target: TuberModel
        embed: false
      - target: TuberCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES

  # v2 logic tests: no host app, so a run is the frameworks and the tests and
  # nothing else. Frameworks are embedded because there is no app to carry
  # them.
  TNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TNTests
    dependencies:
      - target: TNLibrary
      - target: TNNotebook
      - target: TNFormat
      - target: TNModel
      - target: TNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).v2tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  TuberNotes:
    build:
      targets:
        TuberNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TuberNotesTests
        - TNTests
