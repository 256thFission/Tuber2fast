name: TuberNotes

options:
  bundleIdPrefix: com.tubernotes.greenfield
  # A framework two levels down (TNCanvas under TNEditor) must still be
  # embedded in the app, or dyld refuses to launch it.
  transitivelyLinkDependencies: true
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Per-developer signing lives in Local.xcconfig, which is gitignored and
# written by Tools/setup. A team ID committed here would make every
# peer's checkout dirty the moment they built.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: $(TN_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    # Every target is one package, so `package` is the honest default for a
    # declaration one module up the graph needs and nobody outside the app
    # should ever see. `public` here would mean "part of a shipped framework's
    # API", and nothing in this repository ships a framework.
    SWIFT_PACKAGE_NAME: TuberNotes
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

# The module graph, bottom first (Docs/Forks/fundamental-rewrite.md, Part 8):
#
#   TNCore <- TNModel <- TNFormat <- TNRender <- TNNotebook <- TNEditor <- TuberNotes
#                    \__ TNCanvas <-------------------------/         TNLibrary <-/
#
# TNCanvas depends on TNModel and TNCore only: the runtime cannot name the
# format, the notebook, or the library. The app depends on TNEditor and
# never on TNCanvas. The build does not refuse either import, because every
# framework resolves from one products directory; ContractStructureTests does.
targetTemplates:
  # Every framework target below the app. Same product shape, same warnings.
  Framework:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).${target_name}
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        # No SwiftUI below the app target — the compiler's answer to the
        # Contract's Structure rule that nothing below the app imports SwiftUI.
        #
        # It is spelled as a module alias, not as an absent link, because an
        # absent link does not forbid anything: Swift autolinks an imported
        # system framework and the linker finds it in the SDK, so a framework
        # target that never lists SwiftUI still builds if a file imports it.
        # `-module-alias SwiftUI=<nothing>` makes `import SwiftUI` resolve to
        # a module that does not exist. A planted `import SwiftUI` in a
        # framework fails with:
        #
        #   Modules/TNCanvas/PageCanvasController.swift:1:8: error: unable to
        #   resolve module dependency: 'TuberSwiftUIIsNotBelowTheAppTarget'
        #
        # — which is why the alias is named a sentence rather than a letter:
        # the alias name is the whole of the error message a contributor sees.
        #
        # Only SwiftUI is banned this way. UIKit, PencilKit, and CoreGraphics
        # cannot be: PencilKit requires UIKit and Foundation requires
        # CoreGraphics, and an alias breaks the *transitive* load as well as
        # the written import ("missing required module 'UIKit'"). Which
        # targets may import those three stays a `ContractStructureTests`
        # rule, now written per module instead of per file.
        OTHER_SWIFT_FLAGS: $(inherited) -module-alias SwiftUI=TuberSwiftUIIsNotBelowTheAppTarget

targets:

  # Logging and the one trap. Foundation + os.
  TNCore:
    templates: [Framework]
    sources:
      - path: Modules/TNCore

  # Durable values and identities. PencilKit and CoreGraphics for value types
  # only (PKDrawing, CGImage cross the seams as immutable values). No I/O.
  # No UIKit, except TextTypesetting.swift: the typesetting builder the
  # renderer and the live text view share, which the checker names by file.
  TNModel:
    templates: [Framework]
    sources:
      - path: Modules/TNModel
    dependencies:
      - target: TNCore

  # The package format: layout, codecs, the ink container, the planner, the
  # store actor, and the file-primitive seam. Names a file API only in
  # PosixFileSystem.swift.
  TNFormat:
    templates: [Framework]
    sources:
      - path: Modules/TNFormat
    dependencies:
      - target: TNModel
      - target: TNCore

  # Composites, paper, thumbnails, import normalization: CoreGraphics,
  # CoreText, ImageIO, PencilKit for thumbnails. No UIKit, no view, no
  # frame-frequency state.
  TNRender:
    templates: [Framework]
    sources:
      - path: Modules/TNRender
    dependencies:
      - target: TNFormat
      - target: TNModel
      - target: TNCore

  # The notebook: custody, page states, the save engine, history. PencilKit
  # for the PKDrawing value only; no UIKit written, no I/O (the store seam).
  TNNotebook:
    templates: [Framework]
    sources:
      - path: Modules/TNNotebook
    dependencies:
      - target: TNRender
      - target: TNFormat
      - target: TNModel
      - target: TNCore

  # The library: the tree, the trash, the checkout ledger, the identity
  # index. LibraryStore is the one file that names a file API.
  TNLibrary:
    templates: [Framework]
    sources:
      - path: Modules/TNLibrary
    dependencies:
      - target: TNNotebook
      - target: TNRender
      - target: TNFormat
      - target: TNModel
      - target: TNCore

  # The driven canvas runtime. Depends on TNModel only: it cannot name the
  # format, the notebook, or the library.
  TNCanvas:
    templates: [Framework]
    sources:
      - path: Modules/TNCanvas
    dependencies:
      - target: TNModel
      - target: TNCore

  # The one target that names both TNCanvas and TNNotebook: the binding
  # and the editor view model. The app depends on this and never on
  # TNCanvas directly.
  TNEditor:
    templates: [Framework]
    sources:
      - path: Modules/TNEditor
    dependencies:
      - target: TNCanvas
      - target: TNNotebook
      - target: TNRender
      - target: TNFormat
      - target: TNModel
      - target: TNCore

  TuberNotes:
    type: application
    platform: iOS
    sources:
      - path: TuberNotesApp
    dependencies:
      - target: TNEditor
      - target: TNLibrary
      - target: TNNotebook
      - target: TNRender
      - target: TNFormat
      - target: TNModel
      - target: TNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX)
        PRODUCT_NAME: TuberNotes
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # One window is a contract rule (Docs/Forks/fundamental-rewrite.md,
        # "One window"); the checkout ledger is what would make revisiting
        # it safe.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        # All four orientations: the library browser letterboxed on a landscape
        # iPad, and Phillip lifted the portrait pin on 2026-08-08. The coupled
        # bound moved with it — PageProjection.widestSupportedViewportPoints is
        # 1376 (the 13-inch iPad Pro's long edge), and PageGeometryTests holds
        # the pairing: re-pinning portrait without lowering the bound leaves it
        # safely conservative, but widening support without raising it is the
        # trap the test names.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # The share sheet's Save Image row: iOS kills an app that offers a
        # picture and has no reason for the photo library. A consequence of
        # exporting a page as a PNG, not a feature of its own.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Saves the exported page to your photo library.
        # Take Photo and Scan Document: iOS terminates an app that presents a
        # camera controller with no reason for the camera, and nothing in this
        # suite presents a view controller, so CI cannot catch its absence.
        # One string covers both legs — the camera is opened by
        # UIImagePickerController for a photo and by
        # VNDocumentCameraViewController for a scan.
        INFOPLIST_KEY_NSCameraUsageDescription: Takes a photo or scans a document straight into your notes.
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

  TuberNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuberNotesTests
    dependencies:
      - target: TuberNotes
      # Linked but not embedded: the host app already carries them, and a
      # second copy inside the test bundle is a second copy of every global.
      - target: TNEditor
        embed: false
      - target: TNCanvas
        embed: false
      - target: TNLibrary
        embed: false
      - target: TNNotebook
        embed: false
      - target: TNRender
        embed: false
      - target: TNFormat
        embed: false
      - target: TNModel
        embed: false
      - target: TNCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES

  # Logic tests: no host app, so a run is the frameworks and the tests and
  # nothing else. Frameworks are embedded because there is no app to carry
  # them.
  TNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TNTests
    dependencies:
      - target: TNEditor
      - target: TNCanvas
      - target: TNLibrary
      - target: TNNotebook
      - target: TNRender
      - target: TNFormat
      - target: TNModel
      - target: TNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).v2tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  TuberNotes:
    build:
      targets:
        TuberNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TuberNotesTests
        - TNTests
  # The wall-clock benchmarks in HistoryEntryCostTests run only when
  # TN_BENCHMARKS is set: a starved simulator fails them, so the gate skips
  # them. A scheme's skippedTests and selectedTests do not reach Swift
  # Testing suites, which is why this is a variable and not a test list.
  TuberNotesBenchmarks:
    build:
      targets:
        TuberNotes: all
    test:
      # Debug, like the gate: @testable needs testability, and the bounds
      # were measured on Debug builds.
      config: Debug
      environmentVariables:
        TN_BENCHMARKS: "1"
      targets:
        - TNTests
