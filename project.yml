name: TuberNotes

options:
  bundleIdPrefix: com.tubernotes.greenfield
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Per-developer signing lives in Local.xcconfig, which is gitignored and
# written by Tools/setup. A team ID committed here would make every
# peer's checkout dirty the moment they built.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: $(TN_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic

targets:
  TuberNotes:
    type: application
    platform: iOS
    sources:
      - path: TuberNotesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX)
        PRODUCT_NAME: TuberNotes
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The spike has one fixed document and no same-document coordinator.
        # Multiple scenes are enabled only after the despiking architecture
        # supplies scene-scoped sessions and serialized document commits.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
      configs:
        # THROWAWAY SPIKE wiring — CanvasFeatureComplete device spike 1.
        # TN_SPIKE_CONDITIONS is empty by default, so both lines are inert and
        # the flag-off app compiles with exactly the conditions it always had
        # (DEBUG in Debug, none in Release). To build the spike in, pass the
        # setting on the command line
        #   xcodebuild build ... TN_SPIKE_CONDITIONS=TN_SPIKE_MIRROR
        # or add `TN_SPIKE_CONDITIONS = TN_SPIKE_MIRROR` to Local.xcconfig for
        # Tools/device runs (and remove it after).
        #
        # Release carries the same hook as Debug. It used to be Debug-only
        # because the spike's trace depended on CanvasLog's stderr mirror and
        # that mirror was `#if DEBUG`; the mirror now ships in every
        # configuration, gated on TN_TRACE alone, so a Release spike build is
        # readable — and Release is what device.yml distributes.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(TN_SPIKE_CONDITIONS)
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(TN_SPIKE_CONDITIONS)

  TuberNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuberNotesTests
    dependencies:
      - target: TuberNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TN_BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TuberNotes:
    build:
      targets:
        TuberNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TuberNotesTests
